<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phishing URL Detector</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding-top: 60px;
    }
    .container {
        background: #1e293b;
        padding: 30px 40px;
        border-radius: 12px;
        width: 500px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
        text-align: center;
        color: #38bdf8;
        margin-bottom: 20px;
    }
    input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #fff;
        box-sizing: border-box;
        font-size: 15px;
    }
    button {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: #0f172a;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }
    button:hover {
        background: #0ea5e9;
    }
    .result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 8px;
        background: #0f172a;
    }
    .verdict {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .Safe { color: #4ade80; }
    .Suspicious { color: #facc15; }
    .Phishing { color: #f87171; }
    ul {
        padding-left: 20px;
    }
    li {
        margin-bottom: 6px;
        font-size: 14px;
        color: #cbd5e1;
    }
    .score {
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 10px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>🔍 Phishing URL Detector</h1>
    <form method="POST">
        <input type="text" name="url" placeholder="Enter a URL to check..." required>
        <button type="submit">Analyze URL</button>
    </form>

    {% if result %}
    <div class="result">
        <div class="verdict {{ result.verdict }}">{{ result.verdict }}</div>
        <div class="score">Risk Score: {{ result.score }} / 15</div>
        <ul>
            {% for reason in result.reasons %}
            <li>{{ reason }}</li>
            {% endfor %}
        </ul>
        {% if result.reasons|length == 0 %}
        <p>No suspicious indicators found.</p>
        {% endif %}
    </div>
    {% endif %}
</div>
</body>
</html>
